[project]
name = "questionnaire-intelligence"
version = "1.0.0"
description = "Extracción estructurada de cuestionarios desde documentos"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.163.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.33",
    "pymupdf==2.1",
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "pillow==13.0.0",
    "pytesseract==0.3.13",
    "openai==3.51.0",
    "langdetect==1.0.9",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.5",
]
load = [
    "locust==2.47.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
